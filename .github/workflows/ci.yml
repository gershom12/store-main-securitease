name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Make Gradle executable
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Build + Test with Gradle
      - name: Build with Gradle
        run: ./gradlew clean build

      # Build Docker image
      - name: Build Docker image
        run: docker build -t store-app:latest .

      # Run container (smoke test)
      - name: Run Docker container
        run: |
          docker run -d -p 8080:8080 --name store-app store-app:latest
          sleep 15
          curl --fail http://localhost:8080/products || exit 1
          docker stop store-app