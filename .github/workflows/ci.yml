name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Run tests + build jar
      - name: Build with Maven
        run: mvn clean package

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t store-app:latest .

      # Run container for sanity check
      - name: Run Docker container (smoke test)
        run: |
          docker run -d -p 8080:8080 --name store-app store-app:latest
          sleep 10
          curl --fail http://localhost:8080/products || exit 1
          docker stop store-app