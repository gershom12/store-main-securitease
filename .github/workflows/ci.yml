name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: store
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U admin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Make Gradle executable
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # Build project
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # Build Docker image
      - name: Build Docker image
        run: docker build -t store-app:latest .

      # Run container
      - name: Run container
        run: docker run -d -p 8080:8080 --name store-app store-app:latest

      # Show logs (CRITICAL FOR DEBUGGING)
      - name: Show container logs
        run: docker logs store-app